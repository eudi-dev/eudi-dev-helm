# Wallet options. test/e2e.sh creates the secrets and the ConfigMap these values
# reference, and passes the demo verifier issuer CAs and the relying party CAs with --set-file.
haip: true
arf: true
statusList: true
adhocDisplayImages: true
issuance:
  vciVersion: "1.1"
  clientId: e2e-wallet
  redirectURI: https://wallet.example.com/callback
  clientAttestation: true
  keyAttestationLevel: none
presentation:
  sessionTranscript: iso
  preferredFormat: mso_mdoc
  requireEncryptedRequest: true
demoIssuer:
  clientAuth: optional
imprint:
  html: <p>E2E operator, Example Street 1</p>
holderKey:
  existingSecret: e2e-holder-key
issuerKey:
  existingSecret: e2e-issuer-key
catalog:
  entries:
    - name: Employee card
      credentials:
        - format: dc+sd-jwt
          type: urn:example:employee
relyingParties:
  registrations:
    - identifier:
        - identifier: NLTEST.00000042
      tradeName: Example Shop
      legalPerson:
        legalName: ["Example Shop B.V."]
      services:
        - serviceIdentifier: checkout
          intendedUses:
            - intendedUseIdentifier: age-check
              purpose:
                - lang: en
                  content: Check that you are of age
              credentials:
                - format: dc+sd-jwt
                  meta:
                    vct_values: [urn:eudi:pid:1]
                  claims:
                    - path: [birthdate]
credentialTemplates:
  templates:
    employee-card:
      format: sdjwt
      vct: urn:example:employee
      claims:
        employee_id: E-1
credentials:
  existingConfigMap: e2e-credentials
