{{- if include "eudi-dev.createConfigMap" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eudi-dev.configMapName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: wallet
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  {{- if and .Values.imprint.html (not .Values.imprint.existingConfigMap) }}
  imprint.html: {{ .Values.imprint.html | quote }}
  {{- end }}
  {{- if and .Values.demoVerifier.issuerCAs (not .Values.demoVerifier.existingIssuerCASecret) }}
  demo-verifier-issuer-ca.pem: {{ .Values.demoVerifier.issuerCAs | quote }}
  {{- end }}
  {{- if and .Values.relyingPartyCAs (not .Values.existingRelyingPartyCASecret) }}
  relying-party-ca.pem: {{ .Values.relyingPartyCAs | quote }}
  {{- end }}
  {{- if not .Values.credentialTemplates.existingConfigMap }}
  {{- range $name, $template := .Values.credentialTemplates.templates }}
  template-{{ include "eudi-dev.templateFileName" $name }}: {{ $template | toJson | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.credentials.items (not .Values.credentials.existingConfigMap) }}
  credentials.yaml: {{ dict "credentials" .Values.credentials.items | toYaml | quote }}
  {{- end }}
  {{- if include "eudi-dev.pidCredentialsEnabled" . }}
  pid-credentials.yaml: {{ include "eudi-dev.pidCredentials" . | quote }}
  {{- end }}
{{- end }}
