name: Release

# A release runs after CI passed on main. A version that is already tagged is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  HELM_VERSION: v3.22.0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # A chart version is published once. Its git tag marks it as released.
      - name: Publish a new chart version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          name=$(helm show chart . | sed -n 's/^name: //p')
          version=$(helm show chart . | sed -n 's/^version: //p')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          helm dependency build .
          helm package . --destination dist
          helm push "dist/$name-$version.tgz" "$registry"
          gh release create "$tag" "dist/$name-$version.tgz" --title "$tag" \
            --notes "Install with \`helm install my-release $registry/$name --version $version\`. See [the changelog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/$tag/CHANGELOG.md)."
